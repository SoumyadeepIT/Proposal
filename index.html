<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Princess ❤️</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: #ffd6e7;
    overflow: hidden;
  }

  .card {
    text-align: center;
    background: #ffe9f2;
    padding: 40px 50px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    transition: all 0.5s ease;
    position: relative;
    z-index: 2;
  }

  h1 { color: #ff2e88; margin-bottom: 10px; }
  h2 { margin-top: 0; color: #444; }

  .buttons { margin-top: 30px; position: relative; height: 120px; }

  button {
    border: none; padding: 12px 26px; border-radius: 30px;
    font-size: 18px; cursor: pointer;
    transition: transform 0.2s ease, background 0.3s ease;
  }

  #yes { background: #ff4fa3; color: white; }
  #yes:hover { transform: scale(1.1); }

  #no { background: white; color: #ff4fa3; position: absolute; left: 60%; top: 40px; }

  footer { position: absolute; bottom: 20px; font-size: 14px; color: #666; }

  .final { display: none; text-align: center; }
  .love { font-size: 22px; color: #ff2e88; margin-bottom: 15px; }
  .congrats { font-size: 28px; color: #ff2e88; margin-top: 20px; animation: pop 0.8s ease forwards; }

  .photo {
    width: 170px; height: 170px; object-fit: cover;
    border-radius: 50%; border: 5px solid #ff9fc9;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }

  #hearts span{
    position: fixed; bottom: -20px; font-size: 24px;
    animation: floatUp linear forwards; pointer-events:none;
  }

  @keyframes floatUp{
    to{ transform: translateY(-110vh) scale(1.5); opacity:0; }
  }

  @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<div class="card" id="mainCard">
  <h1>I LOVE YOU MY PRINCESS 👸❤️</h1>
  <h2 id="question">Do You Love Me and Will You be My Valentine ?</h2>

  <div class="buttons" id="btns">
    <button id="yes">Yes ❤️</button>
    <button id="no">No 😳</button>
  </div>

  <div class="final" id="finalMessage">
    <div class="love">You are my favourite ❤️</div>
    <img src="photo.jpg" alt="Her photo" class="photo" />
    <div class="congrats">🎉 Congratulations We belong together ❤️ 🎉</div>
  </div>
</div>

<footer>No is shy 🤭</footer>

<div id="hearts"></div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const finalMessage = document.getElementById("finalMessage");
  const hearts = document.getElementById("hearts");

  document.addEventListener("mousemove", (e) => {
    const rect = noBtn.getBoundingClientRect();
    const distance = Math.hypot(e.clientX - rect.x, e.clientY - rect.y);
    if (distance < 120) {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 120);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }
  });

  function startHearts(){
    setInterval(()=>{
      const heart=document.createElement('span');
      heart.innerHTML='❤️';
      heart.style.left=Math.random()*100+'vw';
      heart.style.animationDuration=(3+Math.random()*3)+'s';
      hearts.appendChild(heart);
      setTimeout(()=>heart.remove(),6000);
    },300);
  }

  yesBtn.addEventListener("click", () => {
    finalMessage.style.display = "block";
    document.getElementById("btns").style.display = "none";
    document.getElementById("question").style.display = "none";
    startHearts();
  });
</script>

</body>
</html>
